<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<!--
  ARCHYNDIUM ミニプレイヤー（作り直し）
  ・本体のテーマ色（--accent）と連動
  ・角丸の外に影を出さない（ウィンドウの四角い端で影が切れて「枠」に見えていたため）
  ・歌詞欄は再生部分の下に「重ねず」に並べる。以前は歌詞欄の上端が再生部分（ウィンドウを掴んで動かす領域）の
    下に潜り込んでいて、タイミング等のボタンを押してもウィンドウの移動として扱われることがあった
-->
<style>
  :root { --accent: #25C2A0; --bg: #17171a; --line: rgba(255,255,255,0.08); --muted: rgba(255,255,255,0.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; }

  .mp { height: 100%; display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12);
    background: radial-gradient(120% 70% at 0% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%), var(--bg); background-clip: padding-box; }
  .drag { cursor: default; } /* 掴んで動かす処理は renderer/window-drag.js */
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  svg { pointer-events: none; }

  /* 上段：ジャケット・曲名・閉じる */
  .mp-top { display: flex; align-items: center; gap: 11px; padding: 11px 10px 3px 12px; }
  .art { width: 48px; height: 48px; border-radius: 13px; flex-shrink: 0; position: relative; overflow: hidden;
    background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 80%, #fff 10%), color-mix(in srgb, var(--accent) 45%, #000 55%));
    display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 11px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); }
  .art i { width: 4px; border-radius: 2px; background: rgba(255,255,255,0.92); height: 6px; transition: height 0.2s; }
  .playing .art i { animation: eq 0.9s ease-in-out infinite; }
  .playing .art i:nth-child(2) { animation-delay: -0.3s; } .playing .art i:nth-child(3) { animation-delay: -0.6s; } .playing .art i:nth-child(4) { animation-delay: -0.15s; }
  @keyframes eq { 0%, 100% { height: 6px; } 50% { height: 24px; } }
  .meta { flex: 1; min-width: 0; }
  .title-wrap { overflow: hidden; }
  .title { display: inline-block; white-space: nowrap; font-size: 14px; font-weight: 700; }
  .title.scrolling { animation: marquee 14s linear infinite; }
  @keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--scroll-dist)); } }
  .artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .src { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; }
  .chip { height: 20px; padding: 0 8px; border-radius: 7px; font-size: 10.5px; color: var(--muted); background: rgba(255,255,255,0.06); gap: 5px; min-width: 0; }
  .chip:hover { color: #fff; background: rgba(255,255,255,0.12); }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .chip.locked { color: #E5A93B; background: rgba(229,169,59,0.14); }
  .chip svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .icon-btn { width: 30px; height: 30px; border-radius: 10px; color: var(--muted); flex-shrink: 0; align-self: flex-start; }
  .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .icon-btn.close:hover { background: rgba(232,17,35,0.2); color: #ff8a8a; }

  /* 進捗バー */
  .mp-progress { display: flex; align-items: center; gap: 10px; padding: 3px 14px 0; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mp-progress span { width: 34px; } .mp-progress span:last-child { text-align: right; }
  .bar { flex: 1; height: 16px; display: flex; align-items: center; cursor: pointer; }
  .bar-track { width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); position: relative; transition: height 0.15s; }
  .bar:hover .bar-track { height: 6px; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); width: 0%; }
  .bar-knob { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px var(--accent); left: 0%; opacity: 0; transition: opacity 0.15s; }
  .bar:hover .bar-knob { opacity: 1; }

  /* 操作ボタン */
  .mp-controls { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 10px; }
  .ctl { width: 36px; height: 36px; border-radius: 12px; color: rgba(255,255,255,0.85); position: relative; }
  .ctl:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .ctl:active { transform: scale(0.93); }
  .ctl svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ctl.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .mid { display: flex; align-items: center; gap: 10px; }
  .play { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #111; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  .play:hover { background: #fff; transform: scale(1.04); }
  .play svg { fill: #111; stroke: none; width: 19px; height: 19px; }
  .vol-pop { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #111; font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 7px; opacity: 0; transition: opacity 0.2s; white-space: nowrap; pointer-events: none; }

  /* 歌詞（再生部分の下に並べる。重ねない） */
  .mp-lyrics { flex: 1; min-height: 0; display: none; flex-direction: column; border-top: 1px solid var(--line); padding: 10px 14px 12px; }
  .expanded .mp-lyrics { display: flex; }
  .ly-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .ly-head b { font-size: 11px; letter-spacing: 0.14em; color: var(--muted); margin-right: auto; }
  .pill { height: 30px; padding: 0 11px; border-radius: 9px; gap: 6px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.07); border: 1px solid var(--line); }
  .pill:hover { background: rgba(255,255,255,0.14); }
  .pill:active { transform: scale(0.95); }
  .pill svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; }
  .ly-timing { display: none; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 10px; }
  .ly-timing.show { display: flex; }
  .ly-timing small { font-size: 10px; letter-spacing: 0.12em; color: var(--muted); }
  .ly-timing .row { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ly-timing .pill { min-width: 58px; }
  .ly-timing .offset { min-width: 56px; height: 30px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .ly-timing .offset:hover { background: rgba(255,255,255,0.08); }
  .edit-form { display: none; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .edit-form.show { display: flex; }
  .edit-form input { height: 32px; border-radius: 9px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: #fff; padding: 0 10px; font-size: 12px; outline: none; user-select: text; }
  .edit-form input:focus { border-color: var(--accent); }
  .edit-form .pill { justify-content: center; background: color-mix(in srgb, var(--accent) 30%, transparent); }
  .lyrics-text { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; text-align: center; font-size: 13px; line-height: 2; color: #e8e8e8; white-space: pre-wrap; padding: 0 4px;
    -webkit-mask-image: linear-gradient(transparent, #000 8%, #000 92%, transparent); }
  .lyrics-text::-webkit-scrollbar { width: 4px; }
  .lyrics-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
  .lyrics-text.karaoke { white-space: normal; line-height: 1.5; padding: 30% 4px; position: relative; }
  .lyrics-text .k-line { padding: 5px 0; color: rgba(255,255,255,0.4); transition: color 0.25s, transform 0.25s; }
  .lyrics-text .k-line.past { color: rgba(255,255,255,0.28); }
  .lyrics-text .k-line.active { color: #fff; font-weight: 700; transform: scale(1.06); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent); }
</style>
</head>
<body>
<div class="mp" id="mp">
  <div class="mp-top drag">
    <div class="art"><i></i><i></i><i></i><i></i></div>
    <div class="meta">
      <div class="title-wrap"><div class="title" id="track-title">No Media Playing</div></div>
      <div class="artist" id="track-artist">-</div>
      <div class="src no-drag">
        <button class="chip" id="btn-src-lock" title="このタブに固定 / 解除"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path id="src-shackle" d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg><span id="src-lock-label">自動</span></button>
        <button class="chip" id="track-source" title="クリックで操作するタブを切り替え"><span id="track-source-label">—</span></button>
      </div>
    </div>
    <button class="icon-btn close" id="btn-close" title="閉じる"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
  </div>

  <div class="mp-progress no-drag">
    <span id="time-current">0:00</span>
    <div class="bar" id="progress-container"><div class="bar-track"><div class="bar-fill" id="bar-fill"></div><div class="bar-knob" id="bar-knob"></div></div></div>
    <span id="time-total">0:00</span>
  </div>

  <div class="mp-controls no-drag">
    <button class="ctl" id="btn-volume" title="スクロールで音量 / クリックでミュート">
      <svg id="vol-icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      <div class="vol-pop" id="vol-toast">100%</div>
    </button>
    <div class="mid">
      <button class="ctl" id="btn-prev" title="前へ"><svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg></button>
      <button class="ctl play" id="btn-play" title="再生 / 一時停止"><svg viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></button>
      <button class="ctl" id="btn-next" title="次へ"><svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg></button>
    </div>
    <button class="ctl" id="btn-lyrics-toggle" title="歌詞"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path></svg></button>
  </div>

  <div class="mp-lyrics" id="lyrics-drawer">
    <div class="ly-head">
      <b>LYRICS</b>
      <button class="pill" id="btn-refresh-lyrics" title="この曲の歌詞を検索し直す"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>再検索</button>
      <button class="pill" id="btn-edit-lyrics-toggle" title="曲名・アーティストを入力して検索"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>編集</button>
    </div>
    <!-- カラオケのタイミング調整（本体と共通・曲ごとに記憶） -->
    <div class="ly-timing" id="mini-karaoke-ctl">
      <small>タイミング</small>
      <div class="row">
        <button class="pill" id="mini-k-later" title="歌詞を 0.5 秒遅らせる">−0.5s</button>
        <button class="offset" id="mini-k-offset" title="クリックで 0 に戻す">±0.0s</button>
        <button class="pill" id="mini-k-earlier" title="歌詞を 0.5 秒早める">+0.5s</button>
      </div>
    </div>
    <div class="edit-form" id="lyrics-edit-form">
      <input type="text" id="manual-artist" placeholder="アーティスト名">
      <input type="text" id="manual-song" placeholder="曲名">
      <button class="pill" id="btn-manual-search">この内容で検索</button>
    </div>
    <div class="lyrics-text" id="lyrics-content">曲を再生すると歌詞を表示します</div>
  </div>
</div>

<script src="renderer/window-drag.js"></script>
<script src="mini-player.js"></script>
</body>
</html>
